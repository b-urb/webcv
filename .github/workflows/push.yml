name: CI

on:
  push:
    branches-ignore:
      - main
      - master

env:
  CI: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    container: node:24
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # Same build the deploy workflow runs, minus the deploy: a static export
      # fetches every page's content at build time, so this is the check that
      # the site still builds against Directus -- and it needs the token as
      # DIRECTUS_TOKEN, which is the name lib/directusClient.ts reads.
      - name: Build
        run: npm run build:cloudflare
        env:
          DIRECTUS_TOKEN: ${{ secrets.CI_DIRECTUS_TOKEN }}

      - name: Linter
        run: npm run lint

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: production-artifacts
          retention-days: 3
          include-hidden-files: true
          path: out/
