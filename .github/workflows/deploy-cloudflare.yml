name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches:
      - master
env:
  CI: true

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    container: node:24
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Build Worker (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          DIRECTUS_TOKEN: ${{ secrets.CI_DIRECTUS_TOKEN }}
          ISR_TOKEN: ${{ secrets.CI_ISR_TOKEN }}
          CI_DIRECTUS_TOKEN: ${{ secrets.CI_DIRECTUS_TOKEN }}
          CI_ISR_TOKEN: ${{ secrets.CI_ISR_TOKEN }}
          ANALYTICS_ID: ${{ secrets.ANALYTICS_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
