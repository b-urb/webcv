name: Deploy Cloudflare site
on:
  workflow_dispatch:
  push:
    branches:
      - master
  # Directus dispatches this on a content change, which is what replaces the
  # old ISR revalidation webhook: the site is a static export now, so new
  # content reaches burbn.de by being rebuilt rather than by being fetched.
  repository_dispatch:
    types: [directus-content-changed]
env:
  CI: true

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    container: node:24
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # An editor saving three fields in a row should produce one build, not
      # three. cancel-in-progress above turns the overlap into a single run.
      - name: Debounce
        if: github.event_name == 'repository_dispatch'
        run: sleep 180

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:cloudflare
        env:
          DIRECTUS_TOKEN: ${{ secrets.CI_DIRECTUS_TOKEN }}
          CI_DIRECTUS_TOKEN: ${{ secrets.CI_DIRECTUS_TOKEN }}
          ANALYTICS_ID: ${{ secrets.ANALYTICS_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
